[project]
name = "from-tree-to-forest"
version = "0.1.0"
description = "Reproducible datasets and notebooks for the tree-model companion article"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "catboost==1.2.10",
    "jupyter>=1.1.1",
    "lightgbm==4.7.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "xgboost==3.4.1",
]

[dependency-groups]
dev = [
    "nbstripout>=0.8.1",
    "pre-commit>=4.3.0",
]

[tool.uv]
package = false
